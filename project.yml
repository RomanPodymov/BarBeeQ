name: BarBeeQ
options:
  bundleIdPrefix: com.barbeeq
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "26.3"
packages:
  RPMacro:
    url: https://github.com/RomanPodymov/RPMacro.git
    version: 0.0.1
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture.git
    version: 1.25.5
  TCACoordinators:
    url: https://github.com/RomanPodymov/TCACoordinators.git
    branch: main
  CombineFirebaseFirestore:
    url: https://github.com/RomanPodymov/CombineFirebase.git
    branch: master
  CombineFirebaseAuth:
    url: https://github.com/RomanPodymov/CombineFirebase.git
    branch: master
targets:
  BarBeeQApp:
    settings:
      base:
        SWIFT_VERSION: 6
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ${SWIFT_ACTIVE_COMPILATION_CONDITIONS}
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ComposableArchitecture
      - package: TCACoordinators
      - package: CombineFirebaseFirestore
      - package: CombineFirebaseAuth
      - package: RPMacro
    info:
      path: Sources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: YES
    postCompileScripts:
      - path: swiftformat.sh
        name: SwiftFormat
      - path: swiftlint.sh
        name: SwiftLint
  BarBeeQAppTests:
    settings:
      base:
        SWIFT_VERSION: 6
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ${SWIFT_ACTIVE_COMPILATION_CONDITIONS}
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BarBeeQApp
    info:
      path: Tests/Info.plist
    postCompileScripts:
      - path: swiftformat.sh
        name: SwiftFormat
      - path: swiftlint.sh
        name: SwiftLint
